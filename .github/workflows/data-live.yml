# Données en direct : séismes récents (Maroc, 30 j) et grands séismes mondiaux (M ≥ 6, 1 an), toutes les 15 min.
# Seuls les fichiers de données sont enregistrés (public/data/live, public/data/world) : aucun contenu éditorial.
name: Données en direct

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-live
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer le pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Télécharger les séismes récents
        # Si une source est indisponible, les fichiers existants sont conservés (avertissement, pas d'échec)
        run: python pipeline/fetch_live.py || echo "::warning::Une source de données était indisponible ; fichiers précédents conservés."

      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live public/data/world
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données en direct $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
