# Données en direct : séismes récents (Maroc, 30 j) et grands séismes mondiaux (M ≥ 6, 1 an), toutes les 15 min.
#
# Publiées sur GitHub Pages (gratuit pour un dépôt public, lisible par le site grâce à l'en-tête CORS « * ») :
#   https://<compte>.github.io/<dépôt>/live/30d.geojson … ; le site les lit via PUBLIC_LIVE_DATA_URL.
# Aucun commit n'est fait : l'historique reste propre et le site n'est pas reconstruit toutes les 15 minutes
# (Cloudflare Pages gratuit : 500 constructions par mois). Voir docs/HEBERGEMENT.md.
#
# Prérequis (une fois) : Settings > Pages > Source : « GitHub Actions ».
name: Données en direct

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dépendances du téléchargement
        # fetch_live.py n'a besoin que de « requests » (pas de géotraitement)
        run: pip install "requests>=2.31"

      - name: Télécharger les séismes récents
        # Source indisponible : la copie précédente (dans le dépôt) est conservée — avertissement, pas d'échec
        run: python pipeline/fetch_live.py || echo "::warning::Une source de données était indisponible ; copie précédente conservée."

      - name: Préparer le dossier publié
        run: |
          mkdir -p _site
          cp -r public/data/live public/data/world _site/
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>SismoAtlas — données</title>' \
            '<p>Données en direct de SismoAtlas (EMSC-CSEM, USGS ; villes GeoNames CC BY 4.0). Données préliminaires, révisables.</p>' \
            '<ul><li><a href="live/30d.geojson">live/30d.geojson</a></li><li><a href="world/1y.geojson">world/1y.geojson</a></li></ul>' \
            > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
