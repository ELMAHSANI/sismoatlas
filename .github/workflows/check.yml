# Vérifications sur chaque Pull Request (dont celles du robot) et sur main :
# types, contenus publiés sans « [À COMPLÉTER] », construction du site.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/live/**"
      - "public/data/world/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contenus publiés complets (pas de « À COMPLÉTER »)
        run: npm run check:content

      - name: Vérification des types
        run: npm run check

      - name: Construction du site
        run: npm run build
