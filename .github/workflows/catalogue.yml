# Mise à jour mensuelle du catalogue « Sismicité depuis 2006 » et des données de la carte complète.
name: Catalogue mensuel

on:
  schedule:
    - cron: "30 3 1 * *" # le 1er de chaque mois, 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer le pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Retélécharger la sismicité depuis 2006
        run: python pipeline/fetch_recent_catalogue.py

      - name: Préparer les données de la carte complète
        run: python pipeline/build_map_data.py

      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue public/data/catalogue public/data/sig/plates.geojson
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Catalogue depuis 2006 : mise à jour mensuelle $(date -u +%Y-%m)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
